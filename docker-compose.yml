version: '3.8'

services:
  # ---  Django ---
  web:
    build: .
    command: /app/entrypoint.sh
    volumes:
      - static_volume:/app/static  # Récupère les statiques générés par Django
      - media_volume:/app/media    
    env_file:
      - .env                       
    depends_on:
      - db

  # ---  Base de Données ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    env_file:
      - .env

  # --- Nginx  ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static  # Récupère les statiques générés par Django
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: