name: Build & Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BUILD & PUSH DU BACKEND
      - name: Build et Push de l'image Django
        uses: docker/build-push-action@v5
        with:
          context: ./Certichain/certichain-back
          file: ./Certichain/certichain-back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-back:latest

      # BUILD & PUSH DU FRONTEND
      - name: Build et Push de l'image React (Nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./Certichain/certichain-front
          file: ./Certichain/certichain-front/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-front:latest