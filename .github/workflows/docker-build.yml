name: CI/CD – Build, Push & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # 1. BUILD & PUSH
  # ============================================================
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On génère des tags intelligents (latest + SHA du commit)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/certichain-front
            ghcr.io/${{ github.repository_owner }}/certichain-back
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & Push – Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Certichain/certichain-back
          file: ./Certichain/certichain-back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-back:latest,ghcr.io/${{ github.repository_owner }}/certichain-back:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push – Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Certichain/certichain-front
          file: ./Certichain/certichain-front/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-front:latest,ghcr.io/${{ github.repository_owner }}/certichain-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push – Blockchain
        uses: docker/build-push-action@v6
        with:
          context: ./Certichain/certichain-blockchain
          file: ./Certichain/certichain-blockchain/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-blockchain:latest,ghcr.io/${{ github.repository_owner }}/certichain-blockchain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2. DÉPLOIEMENT
  # ============================================================
  deploy:
    name: Déploiement en production
    runs-on: self-hosted
    needs: build-and-push
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier le fichier .env de production
        run: cp /opt/Certichain/.env ./.env

      - name: Connexion au GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & Update
        run: |
          docker compose pull
        
          docker compose up -d --force-recreate
          
          docker image prune -f
