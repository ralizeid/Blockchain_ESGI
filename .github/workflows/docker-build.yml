name: CI/CD – Build, Push & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # 1. BUILD & PUSH des images Docker vers GHCR
  # ============================================================
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push – Backend (Django)
        uses: docker/build-push-action@v6
        with:
          context: ./Certichain/certichain-back
          file: ./Certichain/certichain-back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push – Frontend (React + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./Certichain/certichain-front
          file: ./Certichain/certichain-front/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/certichain-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2. DÉPLOIEMENT
  # ============================================================
  deploy:
    name: Déploiement en production
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier le fichier .env de production
        run: cp /opt/Certichain/.env ./.env

      - name: Connexion au GHCR pour puller les images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull des nouvelles images
        run: docker compose -f docker-compose.yml pull

      - name: Restart des conteneurs
        run: docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Déconnexion GHCR & nettoyage des images obsolètes
        if: always()
        run: |
          docker logout ghcr.io
          docker image prune -f
