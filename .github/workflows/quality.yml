name: CI Quality Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Tests (Backend / Frontend / Blockchain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # Backend (Django)
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Backend – Installation des dépendances
        working-directory: ./Certichain/certichain-back
        run: pip install -r requirements.txt

      - name: Backend – Tests Django
        working-directory: ./Certichain/certichain-back
        run: python manage.py test
        env:
          SECRET_KEY: 'test-secret-key-pour-ci'
          DEBUG: 'True'

      # ------------------------------------------------------------
      # Frontend (React)
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Frontend – Installation des dépendances
        working-directory: ./Certichain/certichain-front
        run: npm install

      - name: Frontend – Build de test (Vérifie que React compile)
        working-directory: ./Certichain/certichain-front
        run: npm run build
        env:
          CI: 'false'

      # ------------------------------------------------------------
      # Blockchain (Hardhat)
      # ------------------------------------------------------------
      - name: Blockchain – Installation des dépendances
        working-directory: ./Certichain/certichain-blockchain
        run: npm install

      - name: Blockchain – Compilation des contrats
        working-directory: ./Certichain/certichain-blockchain
        run: npm run build

      - name: Blockchain – Tests Hardhat
        working-directory: ./Certichain/certichain-blockchain
        run: npm test
