version: 2
updates:
  - package-ecosystem: "pip"
    directory: "Certichain/certichain-back"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]

  - package-ecosystem: "npm"
    directory: "Certichain/certichain-front"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"